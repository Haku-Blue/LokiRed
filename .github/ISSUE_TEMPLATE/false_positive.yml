name: False positive
description: Report a finding that seems too noisy or incorrect.
title: "[false positive]: "
labels:
  - false-positive
body:
  - type: markdown
    attributes:
      value: |
        Please use sanitized examples. Replace real hostnames, credentials, and repository paths with synthetic values.
  - type: input
    id: rule
    attributes:
      label: Rule ID
      placeholder: HARDCODED_SECRET
    validations:
      required: true
  - type: textarea
    id: finding
    attributes:
      label: Finding output
      description: Paste the relevant sanitized finding text or JSON.
      render: text
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Minimal synthetic config
      description: Provide the smallest sanitized input that triggers the finding.
      render: text
  - type: textarea
    id: why_safe
    attributes:
      label: Why this should be allowed
      description: Explain the intended safe behavior or context.
    validations:
      required: true
