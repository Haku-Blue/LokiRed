name: Package smoke

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  package-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build wheel
        run: |
          python -m pip install build
          python -m build

      - name: Install wheel and run packaged CLI
        shell: bash
        run: |
          python -m venv /tmp/lokired-smoke
          source /tmp/lokired-smoke/bin/activate
          python -m pip install dist/*.whl
          cd /tmp
          lokired scan "$GITHUB_WORKSPACE/test-environment" \
            --format json \
            --fail-on none \
            > /tmp/lokired-smoke.json
