[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lokired"
version = "0.1.0"
description = "CLI scanner for AI-agent and MCP configuration risk."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
lokired = "lokired:main"

[tool.setuptools]
py-modules = [
    "baseline",
    "classification",
    "fingerprints",
    "inventory",
    "lokired",
    "policy",
    "reporter",
    "rule_catalog",
    "run_scanner",
    "security_file_scanner",
]
