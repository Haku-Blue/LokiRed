name: LokiRed

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Scan agent and MCP config
        uses: ./
        with:
          scan-path: "."
          output-format: "text"
          fail-on: "high"
