name: LokiRed SARIF

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      LOKIRED_UPLOAD_CODE_SCANNING: ${{ vars.LOKIRED_UPLOAD_CODE_SCANNING }}
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Generate SARIF
        uses: ./
        with:
          scan-path: "."
          policy-path: ".lokired.yml"
          output-format: "sarif"
          output-file: "lokired.sarif"
          fail-on: "none"

      - name: Upload SARIF to GitHub code scanning
        if: env.LOKIRED_UPLOAD_CODE_SCANNING == 'true' && github.event_name == 'push'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: lokired.sarif

      - name: Enforce LokiRed threshold
        uses: ./
        with:
          scan-path: "."
          policy-path: ".lokired.yml"
          output-format: "text"
          fail-on: "high"
